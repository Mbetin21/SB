<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/style_matches.css">

        <title>SpeakBuddy</title> <!-- Martches and Conversations -->

    </head>
    <body>
        <div class="container">
            <div class="side">
                <div class="header">
                    <div class="avatar"> <!-- Mi avatar-->
                        <img class="avatar_img" src="https://randomuser.me/api/portraits/lego/2.jpg" alt=""/>
                    </div>
                    <div class="title">My profile</div>
                </div>

                <div class="menu">
                    <ul class="menu_ul">
                        <li class="menu_li_matches">Matches</li>
                        <li class="menu_li">Conversations</li>
                    </ul>
                </div>

                <div class="description">
                    <h3>Description</h3>
                    <p>
                        Native language: Spanish <br><br>
                        Learning language: English <br><br>
                        Writing level: 2 <br><br>
                        Reading level: 3 <br><br>
                        Speaking level: 2 <br><br>
                        Comprehension level: 2  <br><br>
                        Interests: Music, Sports, Cinema
                    </p>
                </div>
            </div>
            <div class="content">
                <div class="card">
                    <articule class="article">
                        <img class="user_img" src="https://randomuser.me/api/portraits/lego/5.jpg" alt="Juan, cabello cafe, 24"/>
                        <h2 class="name">Juan Rondón <span>24</span></h2>
                    </articule>
                    <articule class="article">
                        <img class="user_img" src="https://randomuser.me/api/portraits/lego/6.jpg" alt="Sofia, Amante a mexico, 27"/>
                        <h2 class="name">Sofia Smith <span>27</span></h2>
                    </articule>
                    <articule class="article">
                        <img class="user_img" src="https://randomuser.me/api/portraits/lego/7.jpg" alt="Carlos, rojo, 25"/>
                        <h2 class="name">Carlos Gómez <span>25</span></h2>
                    </articule>

                </div>
                <div class="buttons">
                    <button class="button nope">X</button>
                    <button class="button like">❤</button>
                </div>
            </div>
        </div>


        <script src="js/card.js"></script>
    </body>
</html>
